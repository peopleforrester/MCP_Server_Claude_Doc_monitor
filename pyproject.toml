[project]
name = "content-freshness-system"
version = "1.0.3"
description = "Claude-powered training content drift detection system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.77.0",
    "click>=8.3.1",
    "httpx>=0.28.1",
]

[project.scripts]
freshness-check = "cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# cli.py has version definition between standard and local imports
"cli.py" = ["E402"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.0",
]
