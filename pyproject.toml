[project]
name = "content-freshness-system"
version = "1.0.1"
description = "Claude-powered training content drift detection system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.77.0",
    "click>=8.3.1",
    "httpx>=0.28.1",
    "mcp>=1.26.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[project.scripts]
freshness-check = "cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
ignore_missing_imports = true
