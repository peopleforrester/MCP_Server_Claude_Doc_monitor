[project]
name = "content-freshness-system"
version = "1.1.2"
description = "Claude-powered training content drift detection system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.6.0",
    "click>=8.5.0",
    "httpx>=0.28.1",
    "mcp[cli]>=2.2.0",
    "python-dotenv>=1.1.0",
    "tqdm>=4.70.1",
]

[project.scripts]
freshness-check = "cli:main"
freshness-mcp = "mcp_server.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: two top-level modules plus two packages. only-include keeps
# tests, samples, and config files out of the wheel.
only-include = ["cli.py", "config.py", "analyzer", "mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint]
# Pin the rule set explicitly: pyflakes/pycodestyle errors plus import sorting.
# Ruff 0.16 broadened its defaults (BLE, DTZ, SIM, ...); adopting those is a
# deliberate code-change pass, not a lint-version side effect.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# cli.py has version definition between standard and local imports
"cli.py" = ["E402"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
