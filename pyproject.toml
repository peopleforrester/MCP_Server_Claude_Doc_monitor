[project]
name = "content-freshness-system"
version = "1.1.1"
description = "Claude-powered training content drift detection system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.109.2",
    "click>=8.4.1",
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.0",
    "tqdm>=4.68.3",
]

[project.scripts]
freshness-check = "cli:main"
freshness-mcp = "mcp_server.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# cli.py has version definition between standard and local imports
"cli.py" = ["E402"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]
